version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: intellicart_mysql
    restart: always
    environment:
      MYSQL_DATABASE: intellicart_db
      MYSQL_USER: intellicart_user
      MYSQL_PASSWORD: intellicart_pass123
      MYSQL_ROOT_PASSWORD: root_secure_pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: intellicart_redis
    restart: always
    ports:
      - "6379:6379"

  backend_1:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: intellicart_backend_1
    restart: always
    environment:
      DB_ENGINE: mysql
      DB_NAME: intellicart_db
      DB_USER: intellicart_user
      DB_PASSWORD: intellicart_pass123
      DB_HOST: mysql
      DB_PORT: 3306
      USE_REDIS: "True"
      REDIS_HOST: redis
      SECRET_KEY: intellicart-production-secret-key-node1
    depends_on:
      - mysql
      - redis

  backend_2:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: intellicart_backend_2
    restart: always
    environment:
      DB_ENGINE: mysql
      DB_NAME: intellicart_db
      DB_USER: intellicart_user
      DB_PASSWORD: intellicart_pass123
      DB_HOST: mysql
      DB_PORT: 3306
      USE_REDIS: "True"
      REDIS_HOST: redis
      SECRET_KEY: intellicart-production-secret-key-node2
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: intellicart_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2

volumes:
  mysql_data:
